# Default categorization rules.
#
# Rules are checked top to bottom — the first one whose keyword appears in a
# transaction's narration wins, so put more specific rules above more general
# ones (e.g. "Credit Card Payment" above a generic "Bank Fees" catch-all).
#
# Matching is done against the narration with ALL whitespace stripped and
# upper-cased, so keywords should be written as they'd read with spaces
# removed — "credit card" and "creditcard" match the same things; write
# whichever is easiest to read, the app normalizes both.
#
# `direction` is optional: "credit" (money in), "debit" (money out), or
# omitted to match either. Edit this file (or paste a modified copy into the
# app's "Edit rules" panel) to add your own merchants, family members, or
# categories — no code changes needed.

categories:
  - name: Salary / Payroll
    direction: credit
    keywords: [salary, payroll, "salary credit"]

  - name: RSU / Stock Plan Proceeds
    direction: credit
    keywords: ["rsu settlement", "espp", "stock plan", "inw "]

  - name: Interest Income
    direction: credit
    keywords: ["interest paid", "interest credit", "int.pd", "int pd", "int on fd"]

  - name: Dividend Income
    direction: credit
    keywords: [dividend, "fin.div", "int.div", "fnl div"]

  - name: Income Tax Refund
    keywords: ["tax refund", "itd tax refund", "income tax refund"]

  - name: Home Loan / Mortgage
    keywords: ["home loan", "housing loan", "housing development", "hdfcbankltd_yic"]

  - name: Personal / Consumer Loan
    keywords: [bajaj finance, bajajfinserv, "bajaj finserv", moneytap, earlysalary, kissht, "personal loan", "bflm2p1"]

  - name: Credit Card Payment
